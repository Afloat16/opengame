name: Validate trailer recovery generation
on:
  push:
    branches: [validation/improvements-20261127-trailer-recovery-generation]
permissions:
  contents: read
jobs:
  verify:
    name: Verify ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - label: trailer-recovery-generation
            sha: '22462187017d44cff091dbf40c1baaca5e070700'
            tests: 'tests/game-trailer-recovery.test.ts tests/process-lock.test.ts'
    env:
      OPENMOTION_TELEMETRY: '0'
      OPENMOTION_AUTO_UPDATE: '0'
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - name: Checkout exact contribution commit
        uses: actions/checkout@v6.0.2
        with:
          repository: Afloat16/opengame
          ref: ${{ matrix.sha }}
          fetch-depth: 3
          lfs: false
          persist-credentials: false
      - name: Verify source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ matrix.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git show --no-patch --format=fuller HEAD
      - name: Setup repository-pinned Node
        uses: actions/setup-node@v6
        with:
          node-version: '26.11.1'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Reproduce stale recovery on main
        run: |
          git show 8323885ac1ac31d136c353a997acfd0ad2ca554e:game-projects.ts > game-projects.ts
          baseline_log="$RUNNER_TEMP/trailer-main-regressions.log"
          set +e
          node --experimental-strip-types --test --test-reporter=tap tests/game-trailer-recovery.test.ts > "$baseline_log" 2>&1
          baseline_status=$?
          set -e
          cat "$baseline_log"
          git restore --source=HEAD -- game-projects.ts
          test "$baseline_status" -eq 1
          node -e 'const s=require("node:fs").readFileSync(process.env.RUNNER_TEMP+"/trailer-main-regressions.log","utf8"); if(!/^# fail 1$/m.test(s)||!/^# pass 2$/m.test(s)||!s.includes("a stale reader must return the current live recording")) throw new Error("Expected the cross-process stale-generation failure with two passing controls");'
      - name: Run trailer recovery regressions
        run: node --experimental-strip-types --test tests/game-trailer-recovery.test.ts
      - name: Install integration media tools
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
            if ! sudo apt-get "${apt_options[@]}" install -y --no-install-recommends ffmpeg; then
              sudo apt-get "${apt_options[@]}" update
              sudo apt-get "${apt_options[@]}" install -y --no-install-recommends ffmpeg
            fi
          fi
          ffmpeg -version
          ffprobe -version
      - name: Check source policy and suite registration
        run: |
          npm run templates:check -- --final-tree
          npm run storage:check -- --final-tree
          node --test tests/repository-storage.test.ts tests/media-transfer.test.ts
          node --test tests/template-library.test.ts tests/ci-scope.test.mjs
          node --test tests/publish-template-catalog.test.mjs
          node --test --test-skip-pattern='^the scanner opens the nested application' tests/release-scan.test.mjs
      - name: Check source
        run: npm run check
      - name: Check backend types
        run: npm run typecheck:backend
      - name: Check Studio types
        run: npm run typecheck:studio
      - name: Build Studio
        run: npm run build:studio
      - name: Run contribution and existing regressions
        env:
          REGRESSION_FILES: ${{ matrix.tests }}
        run: |
          read -r -a regression_files <<< "$REGRESSION_FILES"
          node --experimental-strip-types --test "${regression_files[@]}"
      - name: Run existing trailer state and adapter regressions
        run: node --experimental-strip-types --test --test-name-pattern='trailer' --test-skip-pattern='^(trailer composition uses the actual|real gameplay recording)' tests/game-projects.test.ts
      - name: Verify tracked source stayed unchanged
        run: git diff --exit-code

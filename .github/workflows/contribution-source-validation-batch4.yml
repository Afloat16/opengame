name: Validate contribution source batch 4
on:
  push:
    branches: [validation/improvements-20261127-batch4]
permissions:
  contents: read
jobs:
  verify:
    name: Verify PR ${{ matrix.pr }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - pr: 97
            sha: 'f66ca6b30e579c9a13f6319105ecf37489ab4d50'
            tests: 'tests/game-runtime-json-limits.test.ts'
          - pr: 98
            sha: '407503e12b367e7180160c4b5a323da9a08584a0'
            tests: 'tests/wechat-minigame.test.ts tests/wechat-package-files.test.ts'
    env:
      OPENMOTION_TELEMETRY: '0'
      OPENMOTION_AUTO_UPDATE: '0'
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - name: Checkout exact contribution commit
        uses: actions/checkout@v6.0.2
        with:
          repository: Afloat16/opengame
          ref: ${{ matrix.sha }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - name: Verify source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ matrix.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git show --no-patch --format=fuller HEAD
      - name: Setup repository-pinned Node
        uses: actions/setup-node@v6
        with:
          node-version: '26.11.1'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check source
        run: npm run check
      - name: Check backend types
        run: npm run typecheck:backend
      - name: Check Studio types
        run: npm run typecheck:studio
      - name: Build Studio
        run: npm run build:studio
      - name: Run contribution regressions
        env:
          REGRESSION_FILES: ${{ matrix.tests }}
        run: |
          read -r -a regression_files <<< "$REGRESSION_FILES"
          node --experimental-strip-types --test "${regression_files[@]}"
      - name: Run existing co-op simulation
        if: matrix.pr == 97
        run: node --experimental-strip-types --test --test-name-pattern 'co-op logic rejects|four reference defenders|co-op spawn order|solo downed player' tests/game-projects.test.ts
      - name: Verify tracked source stayed unchanged
        run: git diff --exit-code


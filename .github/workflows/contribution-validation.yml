name: Validate contribution source batch 3
on:
  push:
    branches: [validation/improvements-20261127-batch3]
permissions:
  contents: read
jobs:
  verify:
    name: Verify PR ${{ matrix.pr }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - pr: 93
            sha: '1a1c8c965fc9ce48a3afa7c0c0411025d35f9728'
            tests: 'tests/wechat-minigame.test.ts'
          - pr: 94
            sha: '3b1310009002bc4178815cbc3fe87186ad3d97d2'
            tests: 'tests/provider-dns-cancellation.test.ts'
          - pr: 95
            sha: 'd43a33237ebde75cff23197a94d29954671c17d7'
            tests: 'tests/game-module-urls.test.ts'
    env:
      OPENMOTION_TELEMETRY: '0'
      OPENMOTION_AUTO_UPDATE: '0'
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - name: Checkout exact contribution commit
        uses: actions/checkout@v6.0.2
        with:
          repository: Afloat16/opengame
          ref: ${{ matrix.sha }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - name: Verify source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ matrix.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git show --no-patch --format=fuller HEAD
      - name: Setup repository-pinned Node
        uses: actions/setup-node@v6
        with:
          node-version: '26.11.1'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check source
        run: npm run check
      - name: Check backend types
        run: npm run typecheck:backend
      - name: Check Studio types
        run: npm run typecheck:studio
      - name: Build Studio
        run: npm run build:studio
      - name: Run contribution regressions
        env:
          REGRESSION_FILES: ${{ matrix.tests }}
        run: |
          read -r -a regression_files <<< "$REGRESSION_FILES"
          node --experimental-strip-types --test "${regression_files[@]}"
      - name: Run existing modular game integration with actual parser
        if: matrix.pr == 95
        run: node --experimental-strip-types --test --test-name-pattern '^H1:' tests/game-harness-generalization.test.ts
      - name: Run existing public DNS policy regression
        if: matrix.pr == 94
        run: node --experimental-strip-types --test --test-name-pattern '^resolvePublicAddresses resolves proxy Fake-IP' tests/gateway.test.ts
      - name: Verify tracked source stayed unchanged
        run: git diff --exit-code

